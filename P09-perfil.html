<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>SIGRED · P09-perfil</title>
    <link rel="stylesheet" href="assets/styles.css">
    <link rel="icon" type="image/png" href="SIGRED\assets\lsigred.png">
</head>

<body>

    <div id="root"></div>

    <script src="assets/app.js"></script>
    <script>
        if (!requireAuth()) { } else {
            shell("Mi perfil", "P09", `
<div class="card">
<form id="profile"><div class="form-grid">
<div class="field"><label>Nombres y apellidos</label><input id="name" value="${esc(SIGRED.current.name)}"></div>
<div class="field"><label>Código institucional</label><input value="${esc(SIGRED.current.code)}" disabled></div>
<div class="field"><label>Correo institucional</label><input value="${esc(SIGRED.current.email)}" disabled></div>
<div class="field"><label>Teléfono</label><input id="phone" value="${esc(SIGRED.current.phone || "")}"></div>
<div class="field"><label>Rol</label><input value="${roleLabel(SIGRED.current.role)}" disabled></div>
</div><div class="actions" style="margin-top:18px"><button class="btn">Guardar cambios</button></div></form>
</div>`);
            qs("#profile").onsubmit = e => { e.preventDefault(); SIGRED.current.name = qs("#name").value; SIGRED.current.phone = qs("#phone").value; saveUser(); toast("Perfil actualizado") };
        }
    </script>
</body>

</html>
